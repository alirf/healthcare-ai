version: '3.8'

services:
  # ─── Database ─────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: healthcare-postgres
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: changeme
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Cache ────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: healthcare-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── Auth Service ─────────────────────────────────
  auth-service:
    build: ./auth-service
    container_name: healthcare-auth
    environment:
      DATABASE_URL: postgres://admin:changeme@postgres:5432/auth_db
      REDIS_URL: redis://redis:6379
      PRIVATE_KEY_PATH: keys/private.pem
      PUBLIC_KEY_PATH: keys/public.pem
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── API Gateway ──────────────────────────────────
  api-gateway:
    build: ./api-gateway
    container_name: healthcare-gateway
    environment:
      GATEWAY_PORT: 8080
      GATEWAY_HOST: 0.0.0.0
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth-service:3001
      PUBLIC_KEY_PATH: keys/public.pem
      RATE_LIMIT_PUBLIC: 10
      RATE_LIMIT_AUTH: 60
      RATE_LIMIT_AI_TRIAGE: 5
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_started
      redis:
        condition: service_healthy

  # ─── User Profile Service ─────────────────────────
  profile-service:
    build: ./user-profile-service
    container_name: profile-service
    ports:
      - "3002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:password@profile-db:5432/profile_db
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=profile-images
      - MINIO_SECURE=false
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:-internal-secret-key-12345}
      - MAX_AVATAR_SIZE_MB=5
    volumes:
      - ../keys/public.pem:/app/keys/public.pem:ro
    depends_on:
      - profile-db
      - minio
    networks:
      - healthcare-network

  profile-db:
    image: postgres:15-alpine
    container_name: profile-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=profile_db
    volumes:
      - profile-db-data:/var/lib/postgresql/data
    networks:
      - healthcare-network

  minio:
    image: minio/minio
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - healthcare-network

volumes:
  profile-db-data:
  minio-data:
  pgdata:

networks:
  healthcare-network:
    external: true